# .github/workflows/ci-cd.yml
# CI/CD pipeline for the backend-amrutam NestJS API
# -------------------------------------------------
# This workflow:
#   • Runs unit tests
#   • Builds a Docker image
#   • Pushes the image to Docker Hub (or Amazon ECR)
#   • Deploys the container to an AWS EC2 instance via SSH

name: CI / CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: backend-amrutam-api
  REGISTRY: docker.io  

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test --if-present

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Log in to Docker Hub (or Amazon ECR)
        if: ${{ env.REGISTRY == 'docker.io' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Uncomment the block below if you use Amazon ECR instead of Docker Hub
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: us-east-1
      #
      # - name: Log in to Amazon ECR
      #   uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository (needed for SSH key)
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST <<'EOS'
            # Pull the new image
            docker pull $IMAGE

            # Stop and remove any existing container
            docker rm -f backend-amrutam-api || true

            # Run the container (adjust ports / env vars as needed)
            docker run -d \
              --name backend-amrutam-api \
              -p 3000:3000 \
              $IMAGE
          EOS
